name: Update job list

on:
  schedule:
    # Twice a day: GitHub sometimes skips a scheduled run when it's busy (it skipped Oct 19)
    - cron: "17 1 * * *" # 9:17 PM ET / 6:47 AM IST
    - cron: "17 13 * * *" # 9:17 AM ET / 6:47 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update.mjs
      - name: Commit if the list changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update job list $(date -u +%Y-%m-%d)"
          git push
